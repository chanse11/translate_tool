audio:
  sample_rate: 16000
  loopback_device: ''
  microphone_device: ''
  virtual_cable_device: CABLE Input
whisper:
  english_model: small.en
  chinese_model: small
  device: cpu
  compute_type: int8
  beam_size: 1
translation:
  source_en: en
  target_zh: zh
  source_zh: zh
  target_en: en
tts:
  voice: en-US-ChristopherNeural
  rate: +10%
  zh_voice: zh-CN-XiaoxiaoNeural
  zh_rate: +0%
vad:
  aggressiveness: 1
  silence_ms: 700
  min_speech_ms: 400
  max_speech_ms: 12000
  pre_roll_ms: 200
  tail_pad_ms: 150
engine:
  backend: bailian
bailian:
  api_key: ''
  workspace_id: ''
  region: cn-beijing
  ws_base: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
  model: qwen3.5-livetranslate-flash-realtime
  zh_en_voice_mode: preset
  zh_en_voice: Ethan
  zh_en_custom_voice_id: ''
  # 云端断句：官方默认 1000ms / 0.2。500ms 太短，句中停顿会被切成半句
  silence_duration_ms: 1000
  vad_threshold: 0.2
  prefix_padding_ms: 500
  ptt_tail_silence_ms: 250
  stream_audio: false
si:
  zh_input_mode: continuous
  tts_chunked: true
  en_tts_default: false
llm:
  enabled: true
  model: qwen-plus
  system_prompt: |
    你是会议助手。根据对方刚说的中文内容，给出简洁、可直接在会上使用的回复建议。
startup:
  preload_models: false
ui:
  ptt_key: Space
  max_subtitle_lines: 50
test:
  phrase: Hi, I'm Ben. This is a test. Can you hear me clearly ?
  test_mode_default: false
